version: '3.8'

services:
  signaling-server:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.signaling
    container_name: remote-vscode-signaling
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - SIGNALING_PORT=4000
      - SIGNALING_HOST=0.0.0.0
      - JWT_SECRET=production-secret-jwt-key-replace-with-secure-32-chars
      - CORS_ORIGIN=*
      - STUN_SERVERS=stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  coturn:
    image: coturn/coturn:latest
    container_name: remote-vscode-turn
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ../configuration/turnserver.conf:/etc/turnserver.conf:ro
