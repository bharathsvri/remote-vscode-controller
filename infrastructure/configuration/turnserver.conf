# coturn TURN/STUN Server Configuration for Remote VS Code Controller
listening-port=3478
tls-listening-port=5349

# IP addresses
listening-ip=0.0.0.0

# Server realm and name
realm=remote-vscode.local
server-name=remote-vscode-turn

# Authentication
lt-cred-mech
user=vscodeuser:vscodepassword

# Fingerprint in TURN messages
fingerprint

# Bandwidth and rate limiting
total-quota=100
max-bps=3000000

# Logging
verbose
no-stdout-log
log-file=/var/log/turnserver.log
